name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Elixir, worker, and conformance checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # A green job certifies the Elixir reference suite and formatting, the
    # TypeScript workalike suite, cross-runtime byte equality on the fixed
    # corpus, and the bounded seeded fuzz below.
    #
    # WHAT IT DOES NOT CERTIFY, stated because a green tick reads as "all of
    # it" and these are invisible in every number the suites print:
    #   * the gated arms named in commonplace_log/test/GATED_ARMS.txt. Check 1
    #     pins that SET so a new one cannot appear silently; nothing here RUNS
    #     them. They need a real wrangler dev socket or a real deployment, and
    #     they are run by hand — see the readiness doc.
    #   * the Cloudflare deployment itself. It exists (readiness doc 4b), but
    #     no job here touches it; every claim about it was run by hand.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.4.8'
          elixir-version: '1.18.4-otp-27'
          version-type: strict

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Cache Mix dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            commonplace_log/deps
            commonplace_log/_build
          key: ${{ runner.os }}-otp-27.3.4.8-elixir-1.18.4-otp-27-mix-${{ hashFiles('commonplace_log/mix.lock') }}

      # Dependency resolution/install always runs, including after cache
      # restore, so a cache miss or stale local artifacts cannot bypass it.
      - name: Fetch Mix dependencies
        working-directory: commonplace_log
        run: mix deps.get

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      # Runs FIRST and costs no BEAM: it names the arms this job does NOT
      # exercise. A module wrapped in a column-0 `if System.get_env(...) do`
      # is absent from every number `mix test` prints, so a green job below
      # says nothing about it.
      - name: Check 1 of 6 - gated-arm inventory matches its manifest
        working-directory: commonplace_log
        run: bash scripts/check_gated_arms.sh

      - name: Check 2 of 6 - Elixir tests
        working-directory: commonplace_log
        run: mix test

      - name: Check 3 of 6 - Elixir formatting
        working-directory: commonplace_log
        run: mix format --check-formatted

      - name: Check 4 of 6 - worker tests
        working-directory: worker
        run: npm test

      - name: Check 5 of 6 - fixed cross-runtime conformance
        run: bash conformance/check.sh

      - name: Check 6 of 6 - seeded cross-runtime fuzz (500 cases)
        run: bash conformance/fuzz.sh 500 20260823
