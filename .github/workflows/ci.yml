name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Elixir, worker, and conformance checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # A green job certifies the Elixir reference suite and formatting, the
    # TypeScript workalike suite, cross-runtime byte equality on the fixed
    # corpus, and the bounded seeded fuzz below. It does not certify any
    # Cloudflare deployment; no deployment exists yet.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.4.8'
          elixir-version: '1.18.4-otp-27'
          version-type: strict

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Cache Mix dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            commonplace_log/deps
            commonplace_log/_build
          key: ${{ runner.os }}-otp-27.3.4.8-elixir-1.18.4-otp-27-mix-${{ hashFiles('commonplace_log/mix.lock') }}

      # Dependency resolution/install always runs, including after cache
      # restore, so a cache miss or stale local artifacts cannot bypass it.
      - name: Fetch Mix dependencies
        working-directory: commonplace_log
        run: mix deps.get

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Check 1 of 5 - Elixir tests
        working-directory: commonplace_log
        run: mix test

      - name: Check 2 of 5 - Elixir formatting
        working-directory: commonplace_log
        run: mix format --check-formatted

      - name: Check 3 of 5 - worker tests
        working-directory: worker
        run: npm test

      - name: Check 4 of 5 - fixed cross-runtime conformance
        run: bash conformance/check.sh

      - name: Check 5 of 5 - seeded cross-runtime fuzz (500 cases)
        run: bash conformance/fuzz.sh 500 20260823
